# claude-vm BAKE config (example) -- issue #179.
#
# claude-vm's config is FOUR files, all optional, split into a BAKE file and a
# BOOT file per tier:
#   global bake: ~/.config/claude-vm/config-bake.yml   (this file's tier)
#   global boot: ~/.config/claude-vm/config-boot.yml
#   per-repo bake: <repo>/.claude-vm/config-bake.yml
#   per-repo boot: <repo>/.claude-vm/config-boot.yml
#
# Which file type each key belongs in, its type, how the two tiers merge it, and
# its default are the launcher's key table, which `claude-vm-config-keys` (the
# plugin's bin/) prints. This file shows what populated entries look like; a key
# left out takes the table's default, and a commented-out line shows a value
# other than the default.
#
# IMAGE IDENTITY: the image cache key + filename is a WHOLE-FILE, RAW-BYTE hash
# of the BAKE files (this one, and the repo's config-bake.yml if present):
#   - a repo with NO repo-bake file shares one image per global-bake hash
#     (~/.local/state/claude-vm/images/guest+global<hash>.raw);
#   - a repo WITH a repo-bake file gets its OWN image, its name in the filename
#     (guest+global<hash>+<reponame>-<repohash>.raw).
# The hash is over the RAW file bytes with NO canonicalization: list order, key
# order, whitespace, and even a TRAILING-NEWLINE TOGGLE all change the hash. A
# trailing-newline toggle is the documented force-rebuild lever. BOOT files
# NEVER affect image identity -- edit egress/cpus/boot-packages freely without
# triggering a rebuild; edit anything in a bake file (including only its
# trailing newline) and the image rebuilds on next launch.
#
# Every repo without a config-bake.yml shares one image per global-bake hash; a
# repo with a config-bake.yml gets its own image (its name disambiguates it,
# even if the file is byte-identical to another repo's -- legibility over
# dedup).
#
# NO SECRETS HERE, with FULL FORCE. A bake-file value is both committed config
# AND image bytes: it persists in the .raw for every session that image serves,
# and the base image is APFS-cloned per run, so it outlives the session that
# wrote it. The host claude.ai OAuth credential is mounted into the guest at
# runtime by the launcher; it is never read from or written to any config file.
# A third-party API KEY reaches the guest the same way, by reference rather than
# by value -- see `env.copy` / `env.files` in config-boot.example.yml, which are
# a hard abort in THIS file precisely because of the persistence above.

---
# apt packages baked into the guest image at build time (package names).
# Present with no network at boot. Use `bake` for packages stable enough not to
# need a fresh copy every launch; put fast-changing packages in the BOOT file's
# `packages:` (installed at boot) instead.
packages:
  - jq
  - ripgrep

# Third-party apt repos rendered into the image at build time (so a baked
# package served by one -- e.g. gh from cli.github.com -- installs at build
# time). Each entry: {name, repo, key_url}. key_url is fetched into a keyring
# and the repo is added signed-by that key. Entries in the bake and boot files
# are deduped by `name`. Same name with identical {repo, key_url} in
# both -> one render (the boot render skips names already baked). Same name with
# DIFFERING content -> loud abort at launch (no silent shadowing).
apt_sources:
  - name: example-repo
    repo: "deb [arch=arm64] https://example.com/apt stable main"
    key_url: https://example.com/apt/key.asc

# Guest-image build sizing: extra MiB of FREE SPACE the guest root filesystem is
# sized ABOVE its base content, so a live session (boot-time apt working set +
# ordinary growth) does not hit ENOSPC. It sizes the .raw, so changing it
# triggers a rebuild, exactly like a `packages:` change does.
# image:
#   root_headroom_mb: 4096

# Claude marketplaces + BAKED plugins.
#
# The image build runs the host-verified guest `claude` binary inside the build
# container, with HOME pointed at the image root, and drives its own CLI:
# `claude plugin marketplace add` for every marketplace below, then
# `claude plugin install` for every `bake:` ref -- so the image ships a real
# /root/.claude/plugins that claude loads with NO marketplace egress at boot.
# A failed add/install FAILS THE BUILD rather than quietly shipping an image
# without the plugin you asked for. That strictness covers exactly what the
# image must CARRY: the marketplaces declared HERE and every `bake:` ref. The
# build also pre-registers marketplaces declared only in the BOOT file, but
# that is an optimization and a failure there only warns -- see the boot
# file's `marketplaces` comment.
#
# The guest's PERMISSION and PLUGIN surface comes from THESE configs only -- the
# host's ~/.claude/settings.json and the host's own installed plugins are never
# copied in. That is deliberate: inside the VM you may want to run a plugin or
# hook you would not enable on the host. (The host's ~/.claude working rules --
# CLAUDE.md, rules/, agents/, skills/, keybindings.json -- ARE seeded in; see
# issue #108. That layer is not policy and has no config key.)
#
# WHY HERE: baked plugins change the guest image's BYTES, so placement in a
# bake file is what puts them under the whole-file image-identity hash -- edit
# either key and the next launch rebuilds. A `claude.plugins` sub-key written
# into the file type the key table does not place it in is REJECTED at launch
# with a message naming the file, rather than parsing and silently baking
# nothing.
#
# marketplaces dedupe by `name` across both file types; the same name with a
# DIFFERING url anywhere aborts the launch. Put a marketplace here when a
# `bake:` ref needs it; put it in the boot file when only an install_at_boot
# ref does, so it does not force an image rebuild.
#
# `name` MUST match the marketplace's OWN name (the `name` in its
# .claude-plugin/marketplace.json) -- claude derives the registered name from
# the source, not from what you write here, and a mismatch would leave every
# `plugin@marketplace` ref unresolvable. The build checks this and aborts.
#
# Prefer an explicit https:// url over the `owner/repo` GitHub shorthand: the
# launcher derives the guest's marketplace egress from the url's host, and a
# shorthand yields no host to derive (it resolves against github.com, which you
# then have to keep in the boot file's egress.allow yourself).
#
# `name:` is mandatory on every entry: it is what a plugin@marketplace ref
# resolves against and what registration is checked by, so an entry with a url
# and no name ABORTS the launch rather than being ignored.
claude:
  marketplaces:
    - name: thevoskamps
      url: https://github.com/TheVoskamps/claude-plugins-marketplace.git
  plugins:
    # A claude.plugins sub-key the key table places in the BOOT file, written
    # here, ABORTS the launch with a message naming this file. That is a
    # PRESENCE test asked of this raw file, so an empty placeholder -- a
    # valueless `enabled:`, or `enabled: []` / `""` / `{}` -- aborts too.
    bake:
      - block-background-agents@thevoskamps
      # COMPILED HOOKS NEED NO TOOLCHAIN: the guardrails permission-gate ships
      # PREBUILT, committed binaries (one per <goos>-<goarch>), so baking it
      # needs NOTHING in `packages:` above -- no `golang`, nothing. The guest
      # is linux-arm64 and the plugin commits a linux-arm64 binary. If a
      # platform ever has no committed binary, the hook hard-blocks every
      # gated tool call rather than silently not adjudicating.
      # - guardrails@thevoskamps

# Guest environment variables (issue #135).
#
# In a BAKE file, `env.set` -- explicit literals, by name -- is written into the
# image at build time, so its values are present in every session that image
# serves and PERSIST across runs.
#
# `env.copy` and `env.files` resolve against the HOST environment at LAUNCH --
# an environment that does not exist while the image is being built -- and a
# value read from it is exactly the kind of secret that must never become image
# bytes. That is why the key table places them as it does; one written into the
# file type it does not place them in is a HARD ABORT, including when the
# sub-key is present but empty. In a boot file they ride the transient
# credential mount the launcher shreds on exit.
#
# NO SECRETS. The "NO SECRETS HERE" note at the top of this file applies to
# `env.set` with full force: the value is committed config AND image bytes.
#
# Precedence across both tiers, lowest to highest:
#   bake env.set  <  boot env.files  <  boot env.copy  <  boot env.set
#
# No new rebuild trigger is needed: the image identity is a whole-file, raw-byte
# hash of the bake files, so changing a value here already invalidates the
# cached image and the next launch rebuilds.
#
# Names must match [A-Za-z_][A-Za-z0-9_]*, values must be scalars (a map or a
# list has no environment representation), a valueless key aborts (write
# `NAME: ""` if you really mean the empty string), and a name claude-vm's own
# launcher composes -- every name in run.env (the proxy vars, CLAUDE_ARGS, the
# *_TAG mount vars, IS_SANDBOX, DISABLE_AUTOUPDATER, the renderer
# CLAUDE_CODE_* vars, the terminal geometry, the CLAUDE_VM_*_UPDATE_AT_BOOT
# flags) plus CLAUDE_VM_LAST_CLAUDE_STATUS -- aborts too, because the guest
# sources run.env BEFORE your env entries: yours would overwrite the launcher's
# own value and break the boot rather than configure anything.
# CLAUDE_VM_LAST_CLAUDE_STATUS is the exception in the other direction (the
# launcher exports it long AFTER the env files, so an entry for it would be
# silently overwritten instead); refusing at load covers both. The abort
# message lists the whole reserved set.
env:
  set:
    FOO_ENDPOINT: https://foo.internal/v2
