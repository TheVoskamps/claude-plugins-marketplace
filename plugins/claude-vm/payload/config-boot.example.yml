# claude-vm BOOT config (example) -- issue #179.
#
# claude-vm's config is FOUR files, all optional, split into a BAKE file and a
# BOOT file per tier:
#   global bake: ~/.config/claude-vm/config-bake.yml
#   global boot: ~/.config/claude-vm/config-boot.yml   (this file's tier)
#   per-repo bake: <repo>/.claude-vm/config-bake.yml
#   per-repo boot: <repo>/.claude-vm/config-boot.yml
#
# PLACEMENT RULE: a key applied at run time (launcher/VM wiring) lives in a BOOT
# file; a key that changes BYTES in the guest .raw image lives in a BAKE file.
# BOOT files NEVER affect image identity -- editing anything here (egress, boot
# packages, cpus/mem, update_at_boot, proxy, mounts, claude.*, github.*) triggers
# NO image rebuild.
#
# Layering across the four files:
#   - Scalars (cpus, mem, guest_image, repo.*, proxy.*, update_at_boot,
#     add_apt_uris_to_allowlist, claude.permission_mode,
#     claude.plugins.update_at_boot, claude.plugins.add_marketplace_uris_to_allowlist,
#     github.auth): repo overrides global; global fills gaps.
#   - Scalar maps (claude.plugins.enabled): repo overrides global PER KEY.
#   - Lists (egress.allow, mounts, `packages` here [installed at boot],
#     apt_sources, claude.permissions.allow/ask/deny, claude.marketplaces,
#     claude.plugins.bake, claude.plugins.install_at_boot): merged -- union of
#     global + repo.
#
# NO SECRETS HERE. The host claude.ai OAuth credential is mounted into the guest
# at runtime by the launcher; it is never read from or written to any config file.
# (egress.allow must include the Anthropic API host below so the in-guest claude
# can reach it.)

cpus: 4
mem: 8192

# guest_image is a normal scalar; a repo may override it. When SET, it is used
# VERBATIM -- an explicit override that OPTS OUT of image-identity derivation.
# When UNSET (the norm), the launcher derives the image path from a self-
# documenting IMAGE IDENTITY hashed from the BAKE files (see
# config-bake.example.yml). Leave it unset unless you own a prebuilt image.
# guest_image: /path/to/guest.raw

repo:
  mount: clone          # clone (default) | live
  copy_back: local      # local (default) | none -- post-exit copy-back target

# apt packages installed AT BOOT, blocking, before claude starts, through the
# proxy (flat list of names). Use this for packages that change often (the AWS
# SDK/CLI is the motivating example) so they stay fresh without an image
# rebuild; put stable packages in the BAKE file's `packages:` instead. A failed
# boot-time install prints a loud warning to the captured console/log and
# CONTINUES to claude -- it never blocks an interactive session on a broken
# mirror.
packages:
  - awscli

# apt-get update && upgrade at boot, through the proxy, before claude starts
# (scalar, repo wins; default true). A BOOT key -- it changes run-time behavior,
# not the image.
update_at_boot: true

# Third-party apt repos a BOOT-time install pulls from (also allowed in the bake
# file). Union+dedup-by-name with the bake file's apt_sources; a name already
# baked into the image is NOT re-rendered at boot. Same shape as the bake file's
# apt_sources: {name, repo, key_url}.
# apt_sources:
#   - name: fast-registry
#     repo: "deb https://registry.example.com/apt stable main"
#     key_url: https://registry.example.com/apt/key.asc

# add_apt_uris_to_allowlist: auto (default) | always -- controls the boot-time
# apt egress derivation: deb.debian.org + security.debian.org, plus every
# apt_sources host, are added to the guest's egress allowlist IFF `packages`
# (installed at boot) is nonempty, OR update_at_boot is true (the default), OR
# this is set to "always". "auto" with update_at_boot: false and no boot-time
# packages derives NO apt egress -- a hard-secure all-baked config leaves the
# guest unable to reach any package repo. "always" keeps the URIs allowlisted so
# an in-guest `apt-get install` still works mid-session even with boot-time apt
# work disabled. Every derived addition is logged.
add_apt_uris_to_allowlist: auto

# Which `claude` binary to run in the guest, and the guest Claude posture. The
# HOST resolves claude.version to a concrete version, downloads that version's
# GPG-signed manifest, verifies the signature against the operator's pinned
# claude-code key, checksum-verifies the binary, caches it, and mounts it RO
# into the guest. A failed gpg --verify or checksum mismatch ABORTS the launch.
#
#   stable          -- (default) latest binary tracking the stable channel
#   latest          -- latest binary tracking the latest channel
#   2.1.172         -- a concrete pinned version (no channel resolution)
#
# signing_key_fingerprint PINS the GPG root of trust. PINNING IS REQUIRED: when
# unset (empty), the verified cache HARD-ABORTS the launch. Import + verify the
# key out of band, then set the fingerprint here:
#   curl -fsSL https://downloads.claude.ai/keys/claude-code.asc | gpg --import
#   gpg --fingerprint claude-code   # confirm against the published value
claude:
  version: stable
  signing_key_fingerprint: ""   # e.g. "AAAA BBBB ... 2222 3333" -- unset = verified cache disabled (hard abort)
  # renderer: which terminal renderer the in-guest claude uses on the
  # interactive console (the vfkit stdio byte-pipe). Both work -- a preference:
  #   classic     -- CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN=1 (no alt-screen)
  #   fullscreen  -- CLAUDE_CODE_NO_FLICKER=1               (force alt-screen)
  #   (unset)     -- pass nothing; claude uses its own default
  # renderer: classic
  # remote_control: OPT-IN boolean. When true, the launcher adds --remote-control
  # (unless already on the command line) and, when RC is in effect but no --name
  # was given, appends a date-stamped --name. Default false/unset. Accepts
  # true/false; any other value aborts the launch.
  # remote_control: false

  # Guest Claude permission mode + rules, rendered into the guest
  # /root/.claude/settings.json. The guest's Claude surface is defined by THESE
  # configs ONLY -- the host's ~/.claude/settings.json is never copied in.
  # YOLO-by-default: the VM is the isolation boundary. Only bypassPermissions |
  # default are accepted; any other value aborts the launch.
  permission_mode: bypassPermissions   # bypassPermissions (default) | default
  permissions:
    allow: []             # list, union
    ask: []               # list, union
    deny: []              # list, union -- enforced even under bypassPermissions

  # Marketplaces + plugins available to the guest.
  marketplaces: []        # {name, url} entries (list, union)
  plugins:
    bake: []              # plugin@marketplace refs baked into the image
                          # (list, union)
    install_at_boot: []   # plugin@marketplace refs installed at boot
                          # (list, union)
    update_at_boot: true  # refresh marketplaces + reinstall changed plugins
                          # at boot (scalar; default true)
    add_marketplace_uris_to_allowlist: auto   # auto (default) | always --
                          # same auto/always semantics as add_apt_uris_to_allowlist,
                          # applied to marketplace URIs (scalar)

    # enabled: OPTIONAL map of plugin ref -> boolean mirroring settings.json's
    # enabledPlugins. Every bake/install_at_boot ref defaults enabled; list an
    # entry ONLY to override (false = installed-but-disabled). Merge is
    # repo-over-global PER KEY. Keys must name an installed ref and values must
    # be boolean -- a typo aborts the launch.
    # enabled:
    #   show-loaded-rules@thevoskamps: false

proxy:
  # A launcher command for your forward proxy. When UNSET, the launcher defaults
  # to the bundled tinyproxy launcher (payload/proxy/tinyproxy-launch.sh), which
  # reads the egress allowlist from $CLAUDE_VM_EGRESS_ALLOWLIST and binds
  # $CLAUDE_VM_PROXY_PORT. Any override must read $CLAUDE_VM_EGRESS_ALLOWLIST.
  # cmd: "my-forward-proxy --allowlist-file $CLAUDE_VM_EGRESS_ALLOWLIST --port 3128"
  port: 3128
  host_alias: 192.168.127.254

# Guest-image provisioner selection is ENV-VAR-ONLY: build-guest-image.sh runs
# the bundled podman-mkosi provisioner unless CLAUDE_VM_IMAGE_PROVISIONER
# points at an alternative. There is deliberately no config key for it -- a
# key here would parse without being read.

egress:
  allow:                # outbound hosts permitted through the proxy
    - api.anthropic.com
    - github.com
    - claude.ai

mounts:                 # extra mounts beyond the repo auto-mount
  - source: ~/.claude/policy
    tag: policy
    mode: ro
  - source: ~/datasets/foo
    tag: data
    mode: ro

# Guest GitHub auth.
github:
  auth: none              # none (default) | host-token (scalar, repo wins)
