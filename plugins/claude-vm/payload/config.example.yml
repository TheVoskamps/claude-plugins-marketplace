# claude-vm configuration (example).
#
# Two layers, both optional:
#   global:   ~/.config/claude-vm/config.yml   (machine-wide defaults)
#   per-repo: <repo>/.claude-vm/config.yml      (project-specific)
#
# Layering:
#   - Scalars (cpus, mem, guest_image, repo.*, proxy.*, packages.update_at_boot,
#     packages.add_apt_uris_to_allowlist, claude.permission_mode,
#     claude.plugins.update_at_boot,
#     claude.plugins.add_marketplace_uris_to_allowlist,
#     github.auth): repo overrides global; global fills gaps.
#   - Scalar maps (claude.plugins.enabled): repo overrides global PER KEY.
#   - Lists (egress.allow, mounts, packages.bake, packages.install_at_boot,
#     packages.apt_sources, claude.permissions.allow/ask/deny,
#     claude.marketplaces, claude.plugins.bake,
#     claude.plugins.install_at_boot): merged -- union of global + repo.
#
# NO SECRETS HERE. The guest authenticates with the HOST's live claude.ai
# OAuth credential, which the launcher extracts from the macOS Keychain at
# launch and shares RO into the guest; it is never read from or written to
# this file. (egress.allow must include the Anthropic API host below so the
# in-guest claude can reach it.)

cpus: 4
mem: 8192

# guest_image is a normal scalar; a repo may override it. When SET, it is used
# VERBATIM -- an explicit override that OPTS OUT of bake-hash image-variant
# derivation (see packages.bake / apt_sources below): you own that path and its
# contents. When UNSET, the launcher derives the image path from the
# bake-relevant config: a config with no baked packages shares the one global
# image (~/.config/claude-vm/images/guest.raw), while a config that bakes
# packages gets its own cached variant (~/.config/claude-vm/images/
# guest-<hash>.raw), built on first use. Either way the image is built on demand.
guest_image: /path/to/guest.raw

repo:
  mount: clone          # clone (default) | live
  copy_back: local      # local (default) | none -- post-exit copy-back target

# Guest software: apt packages baked into the image or installed at boot,
# and third-party apt repos.
#
# packages.bake + packages.apt_sources are BAKED INTO THE GUEST IMAGE at build
# time (issue #105): the baked packages are present in the guest with no network
# needed at boot, and packages served by a third-party apt_source (e.g. gh from
# cli.github.com) install at build time from that repo. Because the image is a
# shared cache, the launcher derives a bake-HASH from the (order-normalized)
# bake + apt_sources config and stores each distinct bake set as its own image
# variant (guest-<hash>.raw). A config with no bake/apt_sources shares the one
# global guest.raw; adding a bake item builds+stores a separate variant on first
# use; removing it reverts to the shared image with no rebuild. Only bake +
# apt_sources feed the hash -- changing cpus/egress/permissions/etc. never
# rebuilds the image. (install_at_boot / update_at_boot are boot-time, NOT baked;
# their consumers land in a sibling slice under #39.)
packages:
  bake: []                # apt packages baked into the guest image at build
                          # time -- present with no network at boot (list, union)
  install_at_boot: []     # apt packages installed at boot, blocking, before
                          # claude starts (list, union)
  update_at_boot: true    # apt-get update && upgrade at boot (scalar, repo
                          # wins; default true)
  apt_sources: []         # third-party apt repos baked into the build so their
                          # packages install at image-build time:
                          # {name, repo, key_url}. key_url is fetched into a
                          # keyring and the repo is added signed-by that key
                          # (list, union)
  add_apt_uris_to_allowlist: auto   # auto (default) | always -- auto adds
                          # derived egress URIs to the proxy allowlist only
                          # when configured boot-time work needs them;
                          # always adds them regardless, enabling in-session
                          # installs (scalar, repo wins)

# Which `claude` binary to run in the guest. The HOST resolves this to a
# concrete version, downloads that version's GPG-signed manifest, verifies
# the signature against the operator's pinned claude-code key, checksum-
# verifies the downloaded binary against the verified manifest, and caches
# it under ~/.config/claude-vm/cache/<version>/linux-arm64/claude. The
# launcher then mounts the verified binary RO into the guest (mountTag=
# claudebin); the guest runs it off the mount and never fetches-and-runs
# install.sh on this trusted path. A failed gpg --verify or a checksum
# mismatch ABORTS the launch -- unverified code is never run.
#
#   stable          -- (default) the latest binary tracking the stable channel
#   latest          -- the latest binary tracking the latest channel
#   2.1.172         -- a concrete pinned version (no channel resolution)
#
# WARM BOOT: when the resolved version is already cached, the binary is not
# re-downloaded and the launcher drops claude.ai / downloads.claude.ai from
# the guest's egress allowlist (the guest never needs them -- the binary
# came from the host-side cache). Operator one-time setup: import the signing
# key, verify its fingerprint out of band, then PIN it below --
#   curl -fsSL https://downloads.claude.ai/keys/claude-code.asc | gpg --import
#   gpg --fingerprint claude-code   # confirm against the published value
#
# signing_key_fingerprint PINS the GPG root of trust to a specific key. A
# bare `gpg --verify` exits 0 for a valid signature under ANY key in your
# keyring, so without this pin the check is not bound to the claude-code key.
# Set it to the fingerprint you verified out of band (spaces/case ignored,
# so the `gpg --fingerprint` form pastes verbatim). PINNING IS REQUIRED for
# the verified cache to function: when this is unset (empty), the verified
# cache HARD-ABORTS the launch -- it does NOT silently trust any key. A valid
# signature by an unpinned key is refused, because the point of a verified
# root of trust is that "some key signed it" is not good enough. There is no
# lower-trust fallback: an unset or unimported signing key aborts the launch.
# (See payload/README.md "Verified claude cache".)
claude:
  version: stable
  signing_key_fingerprint: ""   # e.g. "AAAA BBBB ... 2222 3333" -- unset = verified cache disabled (hard abort)
  # renderer: which terminal renderer the in-guest claude uses on the
  # interactive console (the vfkit stdio byte-pipe; issue #88). Both renderers
  # work over the console -- this is a preference, not a workaround:
  #   classic     -- disable the alternate screen buffer
  #                  (CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN=1)
  #   fullscreen  -- force the flicker-free fullscreen renderer
  #                  (CLAUDE_CODE_NO_FLICKER=1)
  #   (unset)     -- pass nothing; claude uses its own default
  # renderer: classic
  # remote_control: OPT-IN boolean (issue #88). When true, the launcher adds
  # `--remote-control` to the in-guest claude invocation (unless you already
  # passed it on the command line), and -- when Remote Control is in effect but
  # you gave no `--name` -- appends a date-stamped `--name` (format like
  # Jul10-14:30) so the run is named. Default false/unset: claude runs without
  # Remote Control, and your CLI args pass through unchanged. Accepts true/false
  # (or leave unset); any other value aborts the launch.
  # remote_control: false

  # Guest Claude permission mode + permission rules (issue #103 schema, rendered
  # into the guest /root/.claude/settings.json by issue #104). The guest's Claude
  # surface is defined by THESE claude-vm configs ONLY -- the host's
  # ~/.claude/settings.json is never copied in. YOLO-by-default: the VM is the
  # isolation boundary, so permission_mode defaults to bypassPermissions with the
  # deny list as backstop. To run under interactive prompts, set
  # permission_mode: default. Only bypassPermissions | default are accepted; any
  # other value aborts the launch.
  permission_mode: bypassPermissions   # bypassPermissions (default) | default
  permissions:
    allow: []             # list, union
    ask: []               # list, union
    deny: []              # list, union -- enforced even under bypassPermissions

  # Marketplaces + plugins available to the guest (issue #103; schema +
  # merge only).
  marketplaces: []        # {name, url} entries (list, union)
  plugins:
    bake: []              # plugin@marketplace refs baked into the image
                          # (list, union)
    install_at_boot: []   # plugin@marketplace refs installed at boot
                          # (list, union)
    update_at_boot: true  # refresh marketplaces + reinstall changed plugins
                          # at boot (scalar; default true)
    add_marketplace_uris_to_allowlist: auto   # auto (default) | always --
                          # same auto/always semantics as
                          # packages.add_apt_uris_to_allowlist, applied to
                          # marketplace URIs (scalar)

    # enabled: an OPTIONAL map of plugin ref -> boolean that mirrors
    # settings.json's own enabledPlugins vocabulary. It is rendered straight
    # into the guest settings.json's enabledPlugins. Every ref in bake ++
    # install_at_boot defaults to enabled (true); list an entry here ONLY to
    # override that -- `false` marks a plugin installed-but-disabled (flipping
    # it back on needs no reinstall). Useful for toggling debug plugins (e.g.
    # show-loaded-rules / show-loaded-skills) around a specific issue without
    # uninstalling them. Merge is repo-over-global PER KEY. VALIDATION: every
    # value must be a boolean and every key must name a ref that is present in
    # bake or install_at_boot -- an unknown key is treated as a typo and aborts
    # the launch.
    # enabled:
    #   show-loaded-rules@thevoskamps: false
    #   show-loaded-skills@thevoskamps: false

proxy:
  # A launcher command for your forward proxy. When UNSET, the launcher
  # defaults to the bundled tinyproxy launcher
  # (payload/proxy/tinyproxy-launch.sh), which reads the egress allowlist
  # from $CLAUDE_VM_EGRESS_ALLOWLIST and binds $CLAUDE_VM_PROXY_PORT. Set
  # this only to override the default with your own forward proxy; it must
  # read the egress allowlist from $CLAUDE_VM_EGRESS_ALLOWLIST (a
  # newline-delimited host file the launcher writes from egress.allow
  # below) rather than a hand-maintained allowlist baked into the command.
  # cmd: "my-forward-proxy --allowlist-file $CLAUDE_VM_EGRESS_ALLOWLIST --port 3128"
  port: 3128
  host_alias: 192.168.127.254

# Guest-image provisioner. When UNSET, the launcher defaults to the
# bundled podman-mkosi provisioner (payload/provisioners/podman-mkosi.sh):
# mkosi in a throwaway rootless podman container, producing a raw
# EFI-bootable Debian guest. Override via the CLAUDE_VM_IMAGE_PROVISIONER
# env var with a script taking <boot-launcher-path> <output-image-path>.
# provisioner: podman-mkosi

egress:
  allow:                # outbound hosts permitted through the proxy
    - api.anthropic.com
    - github.com
    - claude.ai

mounts:                 # extra mounts beyond the repo auto-mount
  - source: ~/.claude/policy
    tag: policy
    mode: ro
  - source: ~/datasets/foo
    tag: data
    mode: ro

# Guest GitHub auth (issue #103; schema + merge only -- the consumer that
# seeds a host token into the guest lands in a sibling slice under #39).
github:
  auth: none              # none (default) | host-token (scalar, repo wins)
